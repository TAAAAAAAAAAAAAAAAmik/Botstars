<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!--
  Круглая аватарка AraStars, 768x768.

  Собрана из ../welcome.png: логотип и звезда — исходные пиксели.
  Убрано всё, что в круге не читается: заголовок, плашка с ником,
  подпись, разделитель.

  Пересборка:
    cd assets/src
    npx playwright screenshot --viewport-size=768,768 avatar.html ../avatar.png
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:768px; height:768px; overflow:hidden;
         font-family:'Inter Display','Inter',sans-serif }

  .av { position:relative; width:768px; height:768px; overflow:hidden;
        background:
          radial-gradient(540px 540px at 50% 56%, #10294f 0%, rgba(10,22,44,0) 72%),
          linear-gradient(150deg,#01030c 0%,#02060f 55%,#040a1c 100%);
        background-color:#01030c }

  /* размытая подложка из того же кадра: под краем .src должна быть
     фактура, иначе стык читается вертикальной линией */
  .bg { position:absolute; inset:-50px; background:url(../welcome.png) center/cover;
        filter:blur(20px) brightness(.5) saturate(.9) }

  /* исходник целиком, масштаб 1.06; центр звезды (1114,594) -> центр холста (384,384) */
  .src { position:absolute; left:-799px; top:-246px; width:1535px; height:1151px;
         -webkit-mask-image:
           linear-gradient(to right, #000 calc(100% - 42px), transparent 100%),
           linear-gradient(to bottom, transparent 0, #000 54px, #000 100%);
         -webkit-mask-composite:source-in;
                 mask-image:
           linear-gradient(to right, #000 calc(100% - 42px), transparent 100%),
           linear-gradient(to bottom, transparent 0, #000 54px, #000 100%);
                 mask-composite:intersect }

  /* дальний план в расфокусе */
  .src.blur  { filter:blur(9px) brightness(.88) }

  /* резкий слой держится только вокруг звезды — получается ГРИП, как в съёмке */
  .src.sharp { -webkit-mask-image:radial-gradient(circle at 50% 49%,
                   #000 30%, rgba(0,0,0,.9) 44%, rgba(0,0,0,.35) 58%, transparent 70%);
                       mask-image:radial-gradient(circle at 50% 49%,
                   #000 30%, rgba(0,0,0,.9) 44%, rgba(0,0,0,.35) 58%, transparent 70%) }

  /* хвост старого заголовка: исходник до x=838 -> холст до 89 */
  .patch { position:absolute; left:0; top:0; width:112px; height:768px;
           background:linear-gradient(180deg,#01030c,#02050e 60%,#03081a);
           -webkit-mask-image:linear-gradient(to right,#000 92px,transparent 112px);
                   mask-image:linear-gradient(to right,#000 92px,transparent 112px) }

  /* световой спад: мягче и смещён вверх-влево, как от источника в студии */
  .vignette { position:absolute; inset:0; pointer-events:none;
              background:
                radial-gradient(circle at 38% 34%,
                   rgba(120,170,245,.07) 0%, rgba(120,170,245,0) 46%),
                radial-gradient(circle at 50% 50%,
                   rgba(1,3,12,0) 50%, rgba(1,3,12,.38) 76%,
                   rgba(1,3,12,.78) 93%, rgba(1,3,12,.92) 100%) }
</style></head>
<body><div class="av">
  <div class="bg"></div>
  <img class="src blur" src="../welcome.png" alt="">
  <img class="src sharp" src="../welcome.png" alt="">
  <div class="patch"></div>
  <div class="vignette"></div>
</div></body></html>
