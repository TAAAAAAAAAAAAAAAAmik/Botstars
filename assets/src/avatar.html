<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!--
  Круглая аватарка AraStars, 768x768.

  Звезда — исходные пиксели ../welcome.png в масштабе 1:1 (без ресэмплинга),
  сдвинутые так, чтобы центр звезды попал в центр квадрата. Слева закрыт
  остаток старого заголовка, справа фон продолжен градиентом: у исходника
  там почти чёрный однородный край (разброс ~1%), стык не виден.

  Пересборка:
    cd assets/src
    npx playwright screenshot --viewport-size=768,768 avatar.html ../avatar.png
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:768px; height:768px; overflow:hidden }

  .av { position:relative; width:768px; height:768px; overflow:hidden;
        background:
          radial-gradient(520px 520px at 50% 46%, #10294f 0%, rgba(10,22,44,0) 70%),
          linear-gradient(150deg,#01030c 0%,#02060f 55%,#040a1c 100%);
        background-color:#01030c }

  /* исходник 1:1; исходник увеличен в 1.06; центр звезды (1116,594) -> центр холста (384,384) */
  .src { position:absolute; left:-799px; top:-246px; width:1535px; height:1151px }

  /* затемнение по краю: прячет мелочь у границы круга и собирает взгляд на звезде */
  .vignette { position:absolute; inset:0; pointer-events:none;
              background:radial-gradient(circle at 50% 50%,
                 rgba(1,3,12,0) 52%, rgba(1,3,12,.45) 78%,
                 rgba(1,3,12,.82) 93%, rgba(1,3,12,.95) 100%) }

  /* закрывает хвост старого заголовка (исходник до x=846 -> холст до 127) */
  .patch { position:absolute; left:0; top:0; width:112px; height:768px;
           background:linear-gradient(180deg,#01030c,#02050e 60%,#03081a);
           -webkit-mask-image:linear-gradient(to right,#000 92px,transparent 112px);
                   mask-image:linear-gradient(to right,#000 92px,transparent 112px) }
</style></head>
<body><div class="av">
  <img class="src" src="../welcome.png" alt="">
  <div class="patch"></div>
  <div class="vignette"></div>
</div></body></html>
