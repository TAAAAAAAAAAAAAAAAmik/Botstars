<!doctype html>

<!--
  Круглая аватарка бота AraStars, плоский вектор, 768x768.

  Другая подача, не студийный рендер: все формы отрисованы здесь,
  из welcome.png ничего не берётся. Герой — первая буква бренда,
  звезда вырезана из неё через fill-rule="evenodd". Смешивать рендер с векторной
  графикой нельзя — получается мультяшно, это разные языки.

  Фоновые искры намеренно мелкие и целиком попадают в круг. Крупные,
  уходящие за край, не работают: обрезка оставляет в кадре промежутки
  между лучами, и форма читается кляксой, а не звездой.

  Пересборка:
    npx playwright screenshot --viewport-size=768,768 \
        avatar-bot-flat.html ../avatar-bot-flat.png
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:768px; height:768px; overflow:hidden;
         font-family:'Inter Display','Inter',sans-serif }
  .av { position:relative; width:768px; height:768px; overflow:hidden;
        background:radial-gradient(660px 660px at 44% 32%, #111f3f 0%, #060c1b 60%, #04050d 100%) }
  svg.art { position:absolute; inset:0 }
  .mark { position:absolute; left:0; right:0; top:512px; text-align:center;
          font-size:80px; font-weight:800; letter-spacing:-.025em; line-height:1;
          color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.55) }
  .mark em { font-style:normal;
             background:linear-gradient(180deg,#b8e2ff,#4fa3ff);
             -webkit-background-clip:text; background-clip:text; color:transparent }
  .pill { position:absolute; left:50%; transform:translateX(-50%); top:618px;
          padding:11px 32px 13px; border-radius:999px;
          background:linear-gradient(180deg,#63b4ff,#1f80f7);
          font-size:27px; font-weight:800; letter-spacing:.18em; color:#05152f;
          box-shadow:0 8px 26px rgba(33,112,226,.38) }
</style></head>
