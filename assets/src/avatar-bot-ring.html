<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!--
  Круглая аватарка AraStars, 768x768.

  Собрана из ../welcome.png: логотип и звезда — исходные пиксели.
  Убрано всё, что в круге не читается: заголовок, плашка с ником,
  подпись, разделитель.

  Пересборка:
    cd assets/src
    npx playwright screenshot --viewport-size=768,768 avatar.html ../avatar.png
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:768px; height:768px; overflow:hidden;
         font-family:'Inter Display','Inter',sans-serif }

  .av { position:relative; width:768px; height:768px; overflow:hidden;
        background:
          radial-gradient(540px 540px at 50% 56%, #10294f 0%, rgba(10,22,44,0) 72%),
          linear-gradient(150deg,#01030c 0%,#02060f 55%,#040a1c 100%);
        background-color:#01030c }

  /* размытая подложка из того же кадра: под краем .src должна быть
     фактура, иначе стык читается вертикальной линией */
  .bg { position:absolute; inset:-50px; background:url(../welcome.png) center/cover;
        filter:blur(20px) brightness(.5) saturate(.9) }

  /* исходник целиком, масштаб 1.06; центр звезды (1114,594) -> центр холста (384,384) */
  .src { position:absolute; left:-799px; top:-246px; width:1535px; height:1151px;
         -webkit-mask-image:
           linear-gradient(to right, #000 calc(100% - 42px), transparent 100%),
           linear-gradient(to bottom, transparent 0, #000 54px, #000 100%);
         -webkit-mask-composite:source-in;
                 mask-image:
           linear-gradient(to right, #000 calc(100% - 42px), transparent 100%),
           linear-gradient(to bottom, transparent 0, #000 54px, #000 100%);
                 mask-composite:intersect }

  /* хвост старого заголовка: исходник до x=838 -> холст до 89 */
  .patch { position:absolute; left:0; top:0; width:112px; height:768px;
           background:linear-gradient(180deg,#01030c,#02050e 60%,#03081a);
           -webkit-mask-image:linear-gradient(to right,#000 92px,transparent 112px);
                   mask-image:linear-gradient(to right,#000 92px,transparent 112px) }

  /* лучи из-за звезды: повторяющийся конический градиент, погашенный
     радиальной маской — у центра и у края лучей не видно */
  .rays { position:absolute; inset:-120px; pointer-events:none;
          background:repeating-conic-gradient(from -6deg at 50% 50%,
                      rgba(140,195,255,.42) 0deg 1.4deg,
                      rgba(140,195,255,0)   1.4deg 9deg);
          -webkit-mask-image:radial-gradient(circle at 50% 50%,
                      transparent 20%, #000 40%, #000 52%, transparent 72%);
                  mask-image:radial-gradient(circle at 50% 50%,
                      transparent 20%, #000 40%, #000 52%, transparent 72%) }

  /* тёплое свечение под звездой, чтобы лучи «исходили» от неё */
  .halo { position:absolute; inset:0; pointer-events:none;
          background:radial-gradient(circle at 50% 48%,
                      rgba(70,145,255,.30) 0%, rgba(34,80,180,.13) 28%,
                      rgba(10,22,46,0) 56%) }

  /* кольцо-оправа: собирает композицию и даёт аватарке «медальный» вид */
  .ring { position:absolute; inset:26px; border-radius:50%; pointer-events:none;
          border:3px solid rgba(125,190,255,.42);
          box-shadow:0 0 30px rgba(90,160,255,.26),
                     inset 0 0 40px rgba(80,150,255,.10) }
  .ring::after { content:''; position:absolute; inset:9px; border-radius:50%;
                 border:1px solid rgba(110,175,255,.14) }

  .spark { position:absolute; pointer-events:none }

  .vignette { position:absolute; inset:0; pointer-events:none;
              background:radial-gradient(circle at 50% 50%,
                 rgba(1,3,12,0) 54%, rgba(1,3,12,.42) 79%,
                 rgba(1,3,12,.8) 93%, rgba(1,3,12,.95) 100%) }
</style></head>
<body><div class="av">
  <div class="bg"></div>
  <div class="halo"></div>
  <img class="src" src="../welcome.png" alt="">
  <div class="patch"></div>
  <div class="ring"></div>
  <svg class="spark" style="left:132px;top:150px"  width="30" height="30" viewBox="-15 -15 30 30"><path d="M0,-14 L3.1,-4.3 L13,-4.3 L5,2.1 L8,12 L0,5.8 L-8,12 L-5,2.1 L-13,-4.3 L-3.1,-4.3 Z" fill="#8cc0ff" opacity=".85"/></svg>
  <svg class="spark" style="left:596px;top:206px" width="22" height="22" viewBox="-15 -15 30 30"><path d="M0,-14 L3.1,-4.3 L13,-4.3 L5,2.1 L8,12 L0,5.8 L-8,12 L-5,2.1 L-13,-4.3 L-3.1,-4.3 Z" fill="#6ea8f0" opacity=".7"/></svg>
  <svg class="spark" style="left:214px;top:614px" width="18" height="18" viewBox="-15 -15 30 30"><path d="M0,-14 L3.1,-4.3 L13,-4.3 L5,2.1 L8,12 L0,5.8 L-8,12 L-5,2.1 L-13,-4.3 L-3.1,-4.3 Z" fill="#5f97dd" opacity=".6"/></svg>
  <svg class="spark" style="left:556px;top:566px" width="26" height="26" viewBox="-15 -15 30 30"><path d="M0,-14 L3.1,-4.3 L13,-4.3 L5,2.1 L8,12 L0,5.8 L-8,12 L-5,2.1 L-13,-4.3 L-3.1,-4.3 Z" fill="#7bb2f5" opacity=".75"/></svg>
  <div class="vignette"></div>
</div></body></html>
