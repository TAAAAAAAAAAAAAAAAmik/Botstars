<script type="module">
import * as THREE from 'three';

const W = 1500, H = 1800;

// ---------- форма звезды со скруглёнными углами ----------
function starPoints(R, r, n = 5, rot = -Math.PI / 2) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const rad = i % 2 === 0 ? R : r;
    const a = rot + (i * Math.PI) / n;
    p.push(new THREE.Vector2(rad * Math.cos(a), rad * Math.sin(a)));
  }
  return p;
}

function roundedShape(pts, radiusOuter, radiusInner) {
  const s = new THREE.Shape();
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const cur = pts[i];
    const prev = pts[(i - 1 + n) % n];
    const next = pts[(i + 1) % n];
    const want = i % 2 === 0 ? radiusOuter : radiusInner;

    const v1 = new THREE.Vector2().subVectors(prev, cur);
    const v2 = new THREE.Vector2().subVectors(next, cur);
    const d = Math.min(want, v1.length() * 0.48, v2.length() * 0.48);

    const p1 = new THREE.Vector2().addVectors(cur, v1.clone().normalize().multiplyScalar(d));
    const p2 = new THREE.Vector2().addVectors(cur, v2.clone().normalize().multiplyScalar(d));

    if (i === 0) s.moveTo(p1.x, p1.y); else s.lineTo(p1.x, p1.y);
    s.quadraticCurveTo(cur.x, cur.y, p2.x, p2.y);
  }
  s.closePath();
  return s;
}

function makeStar(R, depth, cornerO, cornerI) {
  const shape = roundedShape(starPoints(R, R * 0.42), cornerO, cornerI);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true,
    bevelThickness: R * 0.035, bevelSize: R * 0.035,
    bevelSegments: 5, curveSegments: 28,
  });
  geo.center();
  return geo;
}

// ---------- сцена ----------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(26, W / H, 1, 4000);
camera.position.set(0, 24, 950);
camera.lookAt(0, 0, 0);

const matStar = new THREE.MeshStandardMaterial({
  color: 0x1d6bd2, roughness: 0.52, metalness: 0.14,
});

const star = new THREE.Mesh(makeStar(112, 26, 17, 13), matStar);
star.rotation.set(0.09, -0.33, -0.14);
star.position.set(0, 18, 0);
star.castShadow = true;
scene.add(star);

const small1 = new THREE.Mesh(makeStar(21, 7, 3.6, 2.8),
  new THREE.MeshStandardMaterial({ color: 0x2a62b8, roughness: 0.5, metalness: 0.2 }));
small1.rotation.set(0.15, -0.5, 0.25);
small1.position.set(-142, 142, -70);
scene.add(small1);

const small2 = new THREE.Mesh(makeStar(25, 8, 4.2, 3.2),
  new THREE.MeshStandardMaterial({ color: 0x1b4e9e, roughness: 0.5, metalness: 0.2 }));
small2.rotation.set(-0.1, 0.4, -0.3);
small2.position.set(150, 168, -90);
scene.add(small2);

// постамент
const plinth = new THREE.Mesh(
  new THREE.BoxGeometry(196, 17, 116),
  new THREE.MeshStandardMaterial({ color: 0x121b2c, roughness: 0.75, metalness: 0.1 })
);
plinth.position.set(0, -103, 0);
plinth.receiveShadow = true;
scene.add(plinth);

// ---------- свет ----------
scene.add(new THREE.AmbientLight(0x16335f, 0));
scene.children.pop();
scene.add(new THREE.AmbientLight(0x14305a, 0.95));

const key = new THREE.DirectionalLight(0xffffff, 3.1);
key.position.set(-420, 520, 560);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -400; key.shadow.camera.right = 400;
key.shadow.camera.top = 400;   key.shadow.camera.bottom = -400;
key.shadow.camera.near = 100;  key.shadow.camera.far = 1600;
key.shadow.radius = 3;
scene.add(key);

const rim = new THREE.DirectionalLight(0x8ec5ff, 1.5);
rim.position.set(-520, 260, -340);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x2f6bbf, 0.6);
fill.position.set(480, -120, 320);
scene.add(fill);

// близкий источник — даёт градиент по лицевой грани, как в оригинале
const grad = new THREE.PointLight(0xa8ceff, 160000, 0, 2);
grad.position.set(-210, 205, 300);
scene.add(grad);

// ---------- рендер ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearAlpha(0);
document.body.appendChild(renderer.domElement);
renderer.render(scene, camera);
window.__ready = true;
</script></body></html>
